schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  CoachAven: a Slack Socket-Mode bot driving one sandbox per project, each running Claude Code.
  Two bots run this code: the home bot (canary, follows main, one tenant with `sources`) and prod
  (Bluefin's six projects, runs the last tag). Read CLAUDE.md and docs/rollout.md first: nothing may
  change for prod users as a side effect of a merge; every behaviour change is bucket 1 (bug fix),
  2 (default-preserving with a test proving today's prod shape) or 3 (flag off by default, canary
  first). The host runs deterministic code only — no model calls in the bot process; models run in
  sandboxes. Pure logic lives in its own module with a *.test.ts beside it.

rules:
  proposal:
    - State the rollout bucket (1/2/3 per docs/rollout.md) and the flag or config gate in Impact
    - Say what is out of scope
  specs:
    - Keep each requirement's text under 500 characters, one behaviour per requirement; put the why, examples and edge cases in scenarios or design.md
    - 'The maintainer asks for this standing split (it counts as the user asking): when a change touches an existing spec, split that spec''s requirements over 500 characters in the same delta, the OpenSpec way — under MODIFIED keep the header and every scenario and cut the description to one behaviour without changing its meaning; add each behaviour removed as its own ADDED requirement with its scenarios. The touched spec should then pass `openspec validate <name> --type spec --strict`'
  tasks:
    - Include the docs/rollout.md ledger row and the Home tab update (if a Slack surface changes) as tasks
    - Name the test or command that verifies each task

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

operations:
  archive:
    guidance:
      - After merging the delta, run `openspec validate <spec> --type spec --strict` on every main spec the change touched; if one still has requirements over 500 characters, split them (text stays a short SHALL statement, details move into scenarios) in the same archive PR

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
