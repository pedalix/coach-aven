# Dependabot: npm security updates only (version-update PRs are off — open-pull-requests-limit 0); the
# image's base and tool images (Dockerfile, pinned by digest) get version PRs (OpenSpec bot-image).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The base stays on the Node line the boxes run and CI tests (24): no major bumps; minor, patch and
    # digest bumps of every image in the Dockerfile are welcome.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
