# Groups GitHub's auto-generated release notes (used by the release workflow's
# `gh release create --generate-notes`). PRs are bucketed by their labels; label a PR
# `feature`/`fix`/`ci` etc. to place it, otherwise it falls into "Other changes".
changelog:
  exclude:
    labels:
      - norelease
  categories:
    # First, so the notes lead with it: label `breaking` a change an installation must act on
    # before it upgrades (OpenSpec retire-daytona-driver D12).
    - title: ⚠️ Breaking
      labels:
        - breaking
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Fixes
      labels:
        - fix
        - bug
    - title: 🔧 CI / Chore
      labels:
        - ci
        - chore
        - dependencies
    - title: 📝 Docs
      labels:
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
