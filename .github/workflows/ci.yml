name: CI

# Every push and pull request: typecheck, tests, and the two public-repo guards —
# scripts/public-guard.sh (installation identifiers, from a private deny-list secret) and
# gitleaks (secret-shaped strings). After verify, a push to main builds the commit's image
# (image.yml → ghcr.io/<owner>/coach-aven:sha-<commit>, OpenSpec bot-image), and a pull request
# that changes the image's inputs builds both architectures without publishing. The tag
# pipeline in release.yml runs the same checks before it promotes the image and releases.
# Fork pull requests run this without any secret.
on:
  push:
    branches: [main]      # PR branches are covered by the pull_request event — one run, not two
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: a retitled PR is checked again (release notes come from titles)

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      image_inputs: ${{ steps.image_inputs.outputs.changed }}
      sandbox_inputs: ${{ steps.image_inputs.outputs.sandbox }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the PR's commit messages are checked below
      - name: Does this pull request change the image's inputs? (then it builds the image below)
        id: image_inputs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qxE 'Dockerfile|\.dockerignore|package\.json|package-lock\.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^snapshot/plain/'; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # OpenSpec cli-probe: the committed CLI recordings (src/fixtures/cli/) re-checked against the SDK
      # declarations their reports name — fetched from the npm registry, never committed. No model
      # credential: CI never runs the CLI; live runs are the operator's step (docs/cli-probe.md).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/coach-aven/cli-probe/sdk
          key: cli-probe-sdk-${{ hashFiles('src/fixtures/cli/*/report.json') }}
          restore-keys: cli-probe-sdk-
      - name: cli-probe check (recorded CLI frames against the SDK's declarations)
        run: npm run cli-probe -- check
      - name: public-guard (no installation identifiers in tracked files)
        env:
          # The private deny-list (names, ids, hosts) — a secret, so it never sits in this public repo.
          # Required on pushes and tags; a fork pull request has no secrets and runs the public patterns only.
          PUBLIC_GUARD_PATTERNS: ${{ secrets.PUBLIC_GUARD_PATTERNS }}
          PUBLIC_GUARD_REQUIRE_PRIVATE: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: bash scripts/public-guard.sh
      - name: public-guard (no installation identifiers in the PR's title, body and commit messages)
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_GUARD_PATTERNS: ${{ secrets.PUBLIC_GUARD_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/public-guard.sh --text pr
          git log --format='commit %h%n%B' "$BASE..$HEAD" | bash scripts/public-guard.sh --text commits
      # The image, not gitleaks-action: the Action asks for a licence key on organisation repositories.
      - name: gitleaks (no secret-shaped strings in the tree)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-git --config /repo/.gitleaks.toml --redact --verbose

  # The messaging hub (hub/, a Cloudflare Worker): its own package, tested in workerd. No secrets.
  hub:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The image of every main commit (OpenSpec bot-image): built on native runners after verify and
  # published as sha-<commit>. The canary deploys it; a release tag promotes it (release.yml).
  image:
    needs: verify
    if: github.event_name == 'push'
    uses: ./.github/workflows/image.yml
    with:
      commit: ${{ github.sha }}
    permissions:
      contents: read
      packages: write

  # A pull request that changes the image's inputs (the build file, .dockerignore, package.json, the
  # lockfile) builds both architectures on their native runners without publishing — a dependency that
  # does not install, or installs on one architecture only, fails here and never leaves main without an
  # image. The build reads the registry cache and never writes it. Each image then runs once as a uid
  # the image does not know, as a quickstart or the compose file would run it.
  image-pr:
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.image_inputs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build linux/${{ matrix.arch }} from the commit's tracked files (not published)
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coach-aven"
          git archive --format=tar HEAD | docker buildx build \
            --platform "linux/$ARCH" \
            --cache-from "type=registry,ref=$IMAGE:buildcache-$ARCH" \
            --load -t coach-aven:pr -
      - name: Run it once as a uid the image does not know
        run: |
          set -euo pipefail
          docker run --rm --user 4242:4242 -e HOME=/tmp -e AVEN_DIR=/tmp coach-aven:pr --help
          docker run --rm --entrypoint sh coach-aven:pr -c 'git --version && ssh -V && docker --version && age --version && gitleaks version'

  # The same for the plain sandbox image (published beside the bot, quickstart D3): a pull request that changes
  # snapshot/plain builds it on both architectures without publishing, and checks the toolchain its spec
  # (sandbox-image) promises, the pinned CLI included.
  sandbox-pr:
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.sandbox_inputs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the plain sandbox image for linux/${{ matrix.arch }} (not published)
        run: |
          set -euo pipefail
          git archive --format=tar HEAD:snapshot/plain | docker buildx build --platform "linux/$ARCH" --load -t sandbox-plain:pr -
      - name: The toolchain the spec promises, and no Docker
        run: |
          set -euo pipefail
          docker run --rm sandbox-plain:pr sh -c 'for t in bash git gh curl jq ssh rg node npm python3 pip3 make unzip rsync claude; do command -v $t >/dev/null || { echo "missing: $t"; exit 1; }; done; ! command -v docker; claude --version'
