name: Image

# The bot's image (OpenSpec bot-image; container-deploy D6) and the plain sandbox image (OpenSpec sandbox-image,
# quickstart D3) — the unprivileged sandbox a quickstart runs, published under the same version name as the bot,
# so one version names both. One build per image and architecture on a native runner
# (ubuntu-24.04, ubuntu-24.04-arm — free for public repositories; QEMU would emulate `npm ci` for minutes),
# each pushed by digest, then one manifest list published as sha-<commit>, the full commit id.
#
# Called by ci.yml after verify on every push to main, by release.yml when the tagged commit has no image
# yet, and by hand (workflow_dispatch) for a branch head. The build context is `git archive <commit>`:
# tracked files only, never a working tree. Each architecture reads and writes a build cache in the registry
# (buildcache-<arch>): when the lockfile has not changed, the dependency layer is the very same layer as in
# the previous image, so a box pulls only the code. The sandbox image's context is the commit's
# snapshot/plain tree (`git archive <commit>:snapshot/plain`), built with its Dockerfile's own CLI pin, which
# the CLI gate test keeps on a probed version. The registry is ghcr.io/<owner>/coach-aven(-sandbox-plain), written with
# this workflow's own GITHUB_TOKEN (packages: write); nothing else gets a credential, and the package is
# public, so boxes pull anonymously.

on:
  workflow_call:
    inputs:
      commit:
        description: 'The commit to build (full sha)'
        required: true
        type: string
    outputs:
      image:
        description: 'The image name: ghcr.io/<owner>/coach-aven'
        value: ${{ jobs.manifest.outputs.image }}
      tag:
        description: 'The published tag: sha-<commit>'
        value: ${{ jobs.manifest.outputs.tag }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image:
          - name: coach-aven
            tree: ''
          - name: coach-aven-sandbox-plain
            tree: ':snapshot/plain'
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
      ARCH: ${{ matrix.arch }}
      NAME: ${{ matrix.image.name }}
      TREE: ${{ matrix.image.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.image.name }} for linux/${{ matrix.arch }} from the commit's tracked files and push it by digest
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$NAME"
          git archive --format=tar "$COMMIT$TREE" | docker buildx build \
            --platform "linux/$ARCH" \
            --cache-from "type=registry,ref=$IMAGE:buildcache-$ARCH" \
            --cache-to "type=registry,ref=$IMAGE:buildcache-$ARCH,mode=max" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" \
            -
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          [[ "$digest" == sha256:* ]] || { echo "no digest in the build metadata"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests/$NAME" && touch "$RUNNER_TEMP/digests/$NAME/${digest#sha256:}"
          echo "linux/$ARCH: $IMAGE@$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
    outputs:
      image: ${{ steps.publish.outputs.image }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish each image's manifest list as sha-<commit>
        id: publish
        run: |
          set -euo pipefail
          OWNER="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TAG="sha-$COMMIT"
          for NAME in coach-aven coach-aven-sandbox-plain; do
            IMAGE="$OWNER/$NAME"
            refs=()
            for d in "$RUNNER_TEMP/digests/$NAME"/*; do refs+=("$IMAGE@sha256:$(basename "$d")"); done
            [[ ${#refs[@]} -eq 2 ]] || { echo "$NAME: expected two images (amd64, arm64), got ${#refs[@]}"; exit 1; }
            docker buildx imagetools create -t "$IMAGE:$TAG" "${refs[@]}"
            docker buildx imagetools inspect "$IMAGE:$TAG"
          done
          IMAGE="$OWNER/coach-aven"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
