name: Release & Deploy

# Tag-triggered release pipeline for the CoachAven orchestrator.
#
# Cutting a release: merge your PRs to main, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# No changelog or version edits — the tag IS the version of record. Release notes are
# generated from the PRs merged since the previous tag (grouped per .github/release.yml),
# so write human-readable PR titles.
#
# The tag push runs: verify (typecheck + tests) → GitHub Release (auto-generated notes) →
# SSH deploy to the shared Hetzner box via infra/prod/deploy.sh (deployer key only).
#
# Required config (GitHub → Settings → Environments → "production"):
#   secrets.DEPLOY_SSH_KEY  — private key for deployer@<box> (passphrase-less)
#   secrets.DEPLOY_ENV      — the full contents of infra/prod/.env
#                             (DEPLOY_HOST/DEPLOY_USER/ROOT_USER/REMOTE_DIR/SERVICE_NAME)
# Runtime app secrets (.env, GitHub App key, projects.config.json) are NOT managed here —
# they live on the box and are pushed manually with `npm run prod:export`.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag / branch / sha) to deploy'
        required: true
        default: 'main'

# Never let two prod deploys overlap on the shared box; queue them instead.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release (notes auto-generated from merged PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving its notes as-is."
          else
            # --generate-notes builds the body from PRs merged since the previous tag,
            # categorized per .github/release.yml.
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Configure deployer SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'KEY'
          ${{ secrets.DEPLOY_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/id_ed25519
      - name: Write deploy target config (infra/prod/.env)
        run: |
          cat > infra/prod/.env <<'ENVFILE'
          ${{ secrets.DEPLOY_ENV }}
          ENVFILE
      - name: Deploy to prod (upload → npm ci → restart → health-check)
        run: bash infra/prod/deploy.sh deploy
