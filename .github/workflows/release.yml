name: Release

# Tag-triggered release pipeline for the CoachAven orchestrator.
#
# Cutting a release: merge your PRs to main, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z
# No changelog or version edits — the tag IS the version of record. Release notes are
# generated from the PRs merged since the previous tag (grouped per .github/release.yml),
# so write human-readable PR titles.
#
# The tag push runs: verify (typecheck, tests, guards) → the image (OpenSpec bot-image: the tagged
# commit's sha-<commit> image, built by ci.yml when the commit reached main, gets the names vX.Y.Z
# and, when the tag is the highest release, latest; built here only when it is missing) → GitHub
# Release (auto-generated notes) → a notification to the operator's ops repository, which deploys
# the tag with its own secrets (infra/deploy/ops.example/workflows/deploy.yml). This repository
# holds no deploy key, no deploy target and no environment: an installation is somebody's ops repo.
#
# Optional secrets (only an operator who wants the automatic hand-off sets them; a fork
# cuts releases without them — the notify steps are skipped):
#   secrets.OPS_APP_ID           — a GitHub App installed on the ops repository
#   secrets.OPS_APP_PRIVATE_KEY  — its private key; a token scoped to the ops repo and
#                                  `contents: write` is minted per run and dies in an hour
#   vars.OPS_REPO                — the ops repository to notify, as owner/repo (a repository
#                                  variable; one installation per product repo gets the hand-off)
# Without all three the hand-off is skipped and installations deploy by hand
# (workflow_dispatch in their ops repo, or `npm run ops -- <slug> deploy`).

on:
  push:
    tags: ['v*']

# Least privilege by default; the release job widens its own (contents: write).
permissions:
  contents: read

env:
  OPS_REPO: ${{ vars.OPS_REPO }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: public-guard (no installation identifiers in tracked files)
        env:
          # The private deny-list (names, ids, hosts) — a secret, so it never sits in this public repo.
          # Required on pushes and tags; a fork pull request has no secrets and runs the public patterns only.
          PUBLIC_GUARD_PATTERNS: ${{ secrets.PUBLIC_GUARD_PATTERNS }}
          PUBLIC_GUARD_REQUIRE_PRIVATE: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: bash scripts/public-guard.sh
      - name: gitleaks (no secret-shaped strings in the tree)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-git --config /repo/.gitleaks.toml --redact --verbose

  # The tag's image: does the tagged commit's sha-<commit> image exist? (ci.yml built it when the commit
  # reached main; a tag of a commit that never went through that run is built below.)
  image-check:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.probe.outputs.commit }}
      exists: ${{ steps.probe.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: probe
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/coach-aven"
          # The commit the tag points to, for a lightweight and an annotated tag alike.
          COMMIT="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          if docker buildx imagetools inspect "$IMAGE:sha-$COMMIT" >/dev/null 2>&1; then exists=true; else exists=false; fi
          echo "sha-$COMMIT exists: $exists"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  image-build:
    needs: image-check
    if: needs.image-check.outputs.exists == 'false'
    uses: ./.github/workflows/image.yml
    with:
      commit: ${{ needs.image-check.outputs.commit }}
    permissions:
      contents: read
      packages: write

  # vX.Y.Z is a second name of the commit's image, the same digest the canary ran — never a rebuild. latest
  # as a third name when this tag is the highest release (a patch of an older line leaves it alone).
  promote:
    needs: [image-check, image-build]
    if: ${{ !cancelled() && needs.image-check.result == 'success' && (needs.image-check.outputs.exists == 'true' || needs.image-build.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      COMMIT: ${{ needs.image-check.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # every v* tag, for the highest-version check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The plain sandbox image (quickstart D3) is promoted beside the bot under the same names. A commit built
      # before it was published has no sandbox image: that is a notice, never a failed release.
      - name: Promote sha-<commit> to the release tag (and latest when it is the highest release)
        run: |
          set -euo pipefail
          OWNER="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          highest="$(git tag -l 'v*' | sort -V | tail -1)"
          for NAME in coach-aven coach-aven-sandbox-plain; do
            IMAGE="$OWNER/$NAME"
            if [[ "$NAME" != coach-aven ]] && ! docker buildx imagetools inspect "$IMAGE:sha-$COMMIT" >/dev/null 2>&1; then
              echo "::notice::$IMAGE:sha-$COMMIT does not exist (a commit from before it was published); not promoted"
              continue
            fi
            names=(-t "$IMAGE:$GITHUB_REF_NAME")
            if [[ "$highest" == "$GITHUB_REF_NAME" ]]; then names+=(-t "$IMAGE:latest"); fi
            docker buildx imagetools create "${names[@]}" "$IMAGE:sha-$COMMIT"
            docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
            echo "published ${names[*]} = $IMAGE:sha-$COMMIT (highest release: $highest)"
          done

  release:
    needs: promote
    # After promote, which runs when image-build was skipped (the image existed): without !cancelled() GitHub
    # would skip this job too, because a skipped job anywhere in its needs chain skips it (v0.43.0's run did).
    if: ${{ !cancelled() && needs.promote.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Secrets cannot be read in `if:` directly; this env var can.
      HAS_OPS_APP: ${{ secrets.OPS_APP_PRIVATE_KEY != '' && vars.OPS_REPO != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub Release (notes auto-generated from merged PRs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — leaving its notes as-is."
          else
            # --generate-notes builds the body from PRs merged since the previous tag,
            # categorized per .github/release.yml.
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
      - name: Split OPS_REPO into owner and repo
        if: env.HAS_OPS_APP == 'true'
        id: ops
        run: |
          [[ "$OPS_REPO" == */* ]] || { echo "OPS_REPO must be owner/repo, got '$OPS_REPO'"; exit 1; }
          echo "owner=${OPS_REPO%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${OPS_REPO#*/}" >> "$GITHUB_OUTPUT"
      - name: "Mint a token for the ops repository (scoped to that repo, contents: write)"
        if: env.HAS_OPS_APP == 'true'
        id: ops_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OPS_APP_ID }}
          private-key: ${{ secrets.OPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.ops.outputs.owner }}
          repositories: ${{ steps.ops.outputs.repo }}
          permission-contents: write
      - name: Tell the ops repository to deploy this tag (repository_dispatch)
        if: env.HAS_OPS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.ops_token.outputs.token }}
        run: |
          # 204 = accepted. Any other status fails this job so a broken hand-off is visible
          # on the tag's run; the release itself is already published above.
          printf '{"event_type":"coach-aven-release","client_payload":{"tag":"%s"}}' "$GITHUB_REF_NAME" \
            | gh api -X POST "repos/$OPS_REPO/dispatches" --input -
          echo "dispatched coach-aven-release $GITHUB_REF_NAME → $OPS_REPO"
