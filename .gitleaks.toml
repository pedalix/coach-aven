# gitleaks config for CI (scripts/public-guard.sh covers installation identifiers; this covers
# secret-shaped strings). Test fixtures deliberately contain token-shaped placeholders.
title = "coach-aven"
[extend]
useDefault = true
[allowlist]
paths = [
  # ops overlays (infra/<slug>/, gitignored) hold real secrets on purpose — but only in these files,
  # so allow the files, not the directories (gitleaks is RE2: no lookahead to carve out deploy/ and
  # teams/, and those two are public and must stay scanned). Anything else in an overlay is scanned.
  '''infra/[^/]+/\.env(\.[^/]*)?$''',
  '''infra/[^/]+/.*\.pem$''',
  '''infra/[^/]+/.*\.tfstate(\.[^/]*)?$''',
  '''infra/[^/]+/.*/\.terraform/''',
  '''\.claude/worktrees/''',
  '''node_modules/''',
  '''src/scrub\.test\.ts''',
  '''src/sources/audit\.test\.ts''',
  '''src/fixtures/.*\.json$''',              # anchored: .jsonl recordings (src/fixtures/cli/) are scanned
  '''src/fixtures/scrub-(canary|gold)\.jsonl$''', # the scrub tests' deliberate secret shapes
  '''\.env\.example$''',
  '''infra/deploy/ops\.example/\.env\.example''',
  '''package-lock\.json''',
]
regexes = [
  '''(xoxb|xoxp|xapp)-[0-9]+-[a-z]+''',   # the shapes the scrub tests use (letters, not real ids)
  '''ghp_abcdefghijklmnopqrstuvwxyz0123456789''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''sk-ant-oat01-x+''',
  '''abcdef123456''',                        # rescrub.test.ts fixture
  '''PBTxdRtIrGN26RhPQ7uW5iMA''',             # fixtures.test.ts: the scrubbed Slack verification-token placeholder
]
