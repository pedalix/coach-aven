name: Deploy CoachAven release

# The deploy workflow of an INSTALLATION. Lives in your private ops repo (the one checked
# out at infra/<slug>/ of a coach-aven checkout) as .github/workflows/deploy.yml.
# The public product repo only publishes releases and images; deploying one is this file's job.
#
# Triggers:
#   workflow_dispatch(tag) — deploy any version by hand: a first install, a rollback to the
#     previous version, the normal path. `npm run release -- vX.Y.Z` from a product checkout
#     tags and starts this run.
#   repository_dispatch `coach-aven-release` — optional: sent by the product repo's release
#     job when it has your App secrets (OPS_APP_ID / OPS_APP_PRIVATE_KEY); payload = {tag}.
#
# Settings of THIS repo:
#   secret   DEPLOY_SSH_KEY   — passphrase-less private key for deployer@<your box>
#   variable OPS_SLUG         — your installation's slug (the directory name under infra/)
#   secrets  APP_ID, APP_PRIVATE_KEY — optional: a GitHub App that can read the product repo.
#            Only needed while the product repo is private to you (a fork of your own);
#            without them the checkout uses the default token, which reads any public repo.
#
# The deploy target (host, users, remote dir, service name) is deploy.env in this repo — tracked, so the
# run reads it from its own checkout; no DEPLOY_ENV secret.
#
# What runs: exactly the manual `npm run ops -- <slug> deploy <version>` (OpenSpec container-deploy): the box
# pulls ghcr.io/<owner>/coach-aven:<version>, pins it, `docker compose up -d`, waits for the driver's "bot
# running" line; nothing is uploaded from here. A version is vX.Y.Z, or sha-<commit> when deploy.env says
# CANARY=1 (the installation that runs main). Rollback = the earlier version.
# It never touches the box's .env, App key, projects.config.json or state.json; those go up
# with `npm run ops -- <slug> export` from your machine.

on:
  repository_dispatch:
    types: [coach-aven-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to deploy: vX.Y.Z, or sha-<commit> on a canary installation'
        required: true

# Never let two deploys overlap on the box; queue them instead.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PRODUCT_REPO: pedalix/coach-aven
  OPS_SLUG: ${{ vars.OPS_SLUG }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      HAS_APP: ${{ secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check out this ops repo (the installation's overlay)
        uses: actions/checkout@v7
        with:
          path: overlay
      - name: Validate the version against this installation (vX.Y.Z; sha-<commit> only on a canary — never a branch)
        id: version
        run: |
          [[ "$OPS_SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "set the repository variable OPS_SLUG to your installation's slug"; exit 1; }
          # The canary mark comes from the tracked deploy.env, like the target.
          CANARY="$(sed -n 's/^CANARY=//p' overlay/deploy.env | tail -1)"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ref="refs/tags/$TAG"
          elif [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            [[ "$CANARY" == 1 ]] || { echo "refusing to deploy '$TAG': a main commit's image deploys only on a canary installation (CANARY=1 in deploy.env)"; exit 1; }
            ref="${TAG#sha-}"
          else
            echo "refusing to deploy '$TAG': a version is vX.Y.Z, or sha-<commit> on a canary — never a branch or latest"; exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "deploying $PRODUCT_REPO@$TAG to installation $OPS_SLUG"
      - name: Mint a read token for the product repo (only if it is private to you)
        if: env.HAS_APP == 'true'
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: pedalix
          repositories: coach-aven
          permission-contents: read
      - name: Check out the product repo at the version (its deploy tooling; the box pulls the image)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ steps.version.outputs.ref }}
          token: ${{ steps.app.outputs.token || github.token }}
          path: src
      - name: Put the overlay beside it, at infra/<slug>/
        run: mv overlay "src/infra/$OPS_SLUG"
      - name: Configure deployer SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/id_ed25519 <<'KEY'
          ${{ secrets.DEPLOY_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy
        run: |
          if [[ -f src/infra/deploy/deploy.sh ]]; then
            bash src/infra/deploy/deploy.sh "$OPS_SLUG" deploy "$TAG"
          else
            # A release from before the infra/<slug>/ layout (a rollback to ≤ v0.41.0): its
            # deploy.sh reads the target from infra/prod/.env and knows no overlays, so hand it
            # the target and keep the overlay out of the upload. Same deploy either way.
            mv "src/infra/$OPS_SLUG" "$RUNNER_TEMP/overlay"
            cp "$RUNNER_TEMP/overlay/deploy.env" src/infra/prod/.env
            bash src/infra/prod/deploy.sh deploy
          fi
